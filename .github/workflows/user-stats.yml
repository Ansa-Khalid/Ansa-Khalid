name: user-statistician

on:
  # Run daily at 03:00 UTC
  schedule:
    - cron: '0 3 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Generate user stats image with repo contributions
      - name: Generate GitHub Stats Image
        uses: cicirello/user-statistician@v1
        with:
          image-file: "images/userstats.svg"
          include-title: true
          hide-keys: false                # Show project/repo names
          colors: "dark"
          commit-and-push: true
          category-order: "general, contributions, repos"  # Show per-project stats
          commit-message: "Update GitHub Stats (Automated)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
